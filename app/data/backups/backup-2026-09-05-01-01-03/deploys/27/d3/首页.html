<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>首页 · test</title>
<style>*{margin:0;padding:0}body{-webkit-font-smoothing:antialiased}button{font-family:inherit}a{font-family:inherit}</style>
</head>
<body>
  <div style="min-height:100vh;width:100%;background:#ffffff;color:#09090b;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;display:flex;flex-direction:column">
    <div style="display:flex;flex-direction:column;align-items:stretch;gap:0px">
      <header style="position:sticky;top:0px;z-index:20px;display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:rgba(255,255,255,0.9);backdrop-filter:blur(8px);border-bottom:1px solid rgba(0,0,0,0.06)">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="width:30px;height:30px;border-radius:10px;background:#4f46e5;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700px;font-size:14px">A</span>
          <strong style="font-size:17px;color:#09090b">A2UI</strong>
        </div>
        <nav style="display:flex;gap:26px">
          <a href="#" style="font-size:14px;color:#71717a;text-decoration:none;cursor:pointer">产品</a>
          <a href="#" style="font-size:14px;color:#71717a;text-decoration:none;cursor:pointer">文档</a>
          <a href="#" style="font-size:14px;color:#71717a;text-decoration:none;cursor:pointer">定价</a>
          <a href="#" style="font-size:14px;color:#71717a;text-decoration:none;cursor:pointer">关于</a>
        </nav>
        <button style="display:inline-flex;align-items:center;gap:6px;font-weight:500px;border-radius:10px;padding:7px 14px;font-size:13px;cursor:pointer;border:none;width:fit-content;background:#4f46e5;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.08)">开始设计</button>
      </header>
      <section style="text-align:center;padding:104px 24px;position:relative;overflow:hidden">
        <span style="display:inline-block;padding:5px 14px;font-size:12px;font-weight:500px;border-radius:999px;border:1px solid rgba(0,0,0,0.1);background:rgba(255,255,255,0.75);color:#09090b;margin-bottom:22px">AI 驱动的页面设计工作台</span>
        <h1 style="font-size:52px;font-weight:800px;letter-spacing:-0.02em;line-height:1.14px;color:#09090b;max-width:820px;margin:0 auto;white-space:pre-line">用一句话，生成完整页面</h1>
        <p style="font-size:17px;color:#71717a;max-width:640px;margin:20px auto 0;line-height:1.65px">在右侧 Agent 面板描述你想要的页面，大模型会逐 token 流式生成并实时渲染到画布。</p>
        <div style="display:flex;gap:12px;justify-content:center;margin-top:34px">
          <button style="display:inline-flex;align-items:center;gap:6px;font-weight:500px;border-radius:10px;padding:12px 24px;font-size:15px;cursor:pointer;border:none;width:fit-content;background:#4f46e5;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.08)">开始生成</button>
          <button style="display:inline-flex;align-items:center;gap:6px;font-weight:500px;border-radius:10px;padding:12px 24px;font-size:15px;cursor:pointer;border:1px solid rgba(0,0,0,0.12);width:fit-content;background:#fff;color:#09090b">查看示例</button>
        </div>
      </section>
      <footer style="border-top:1px solid rgba(0,0,0,0.06);background:#fff;margin-top:32px;padding:44px 32px;display:flex;flex-wrap:wrap;gap:40px;justify-content:space-between">
        <div style="display:flex;flex-direction:column;gap:8px">
          <strong style="font-size:17px;color:#09090b">A2UI</strong>
          <span style="font-size:12px;color:#71717a">© 2026 A2UI Studio</span>
        </div>
        <div style="display:flex;gap:64px">
          <div style="display:flex;flex-direction:column;gap:10px">
            <span style="font-size:14px;font-weight:600px;color:#09090b">产品</span>
            <a href="#" style="font-size:14px;color:#71717a;text-decoration:none">功能</a>
            <a href="#" style="font-size:14px;color:#71717a;text-decoration:none">定价</a>
            <a href="#" style="font-size:14px;color:#71717a;text-decoration:none">更新日志</a>
          </div>
          <div style="display:flex;flex-direction:column;gap:10px">
            <span style="font-size:14px;font-weight:600px;color:#09090b">资源</span>
            <a href="#" style="font-size:14px;color:#71717a;text-decoration:none">文档</a>
            <a href="#" style="font-size:14px;color:#71717a;text-decoration:none">组件目录</a>
            <a href="#" style="font-size:14px;color:#71717a;text-decoration:none">快捷键</a>
          </div>
        </div>
      </footer>
    </div>
  </div>

</body>
</html>
